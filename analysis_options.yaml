# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# FIX: Switched from `package:flutter_lints/flutter.yaml` to
# `package:lints/recommended.yaml` to avoid pulling in lints-4.0.0 which
# references rules unrecognised by the current Dart SDK:
#   - no_wildcard_variable_uses        (requires Dart >=3.3)
#   - type_literal_in_constant_pattern (requires Dart >=3.0)
#
# REQUIRED pubspec.yaml change — replace in dev_dependencies:
#   flutter_lints: ^4.0.0   →   lints: ^2.1.0
#
# Then run: flutter pub get
include: package:lints/recommended.yaml

linter:
  rules:
    # ── Style ────────────────────────────────────────────────────────────────
    prefer_single_quotes: true
    always_use_control_flow_braces: true

    # ── Safety ───────────────────────────────────────────────────────────────
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true

    # ── Performance ──────────────────────────────────────────────────────────
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true