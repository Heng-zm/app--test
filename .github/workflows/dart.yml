name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Release Build
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: |
          flutter pub get
          # Generate essential iOS config files
          flutter build ios --config-only --no-codesign
          cd ios
          pod install
        working-directory: .

      - name: 🔓 Bypass Apple Signing Requirements
        # This removes the Development Team and Provisioning requirements from the project file
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;//g' ios/Runner.xcodeproj/project.pbxproj

      - name: 🏗️ Build iOS (Unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 📦 Package IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 BT-SecureChat.ipa Payload
          
      - name: 🚀 Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/BT-SecureChat.ipa
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.ipa
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat Release
            - **Status:** Unsigned (Ready for Sideloading)
            - **Instructions:** Install using AltStore, Sideloadly, or TrollStore.
            - **Build ID:** ${{ github.run_number }}
