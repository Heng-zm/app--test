name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Release Build
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install
        working-directory: .

      - name: 🔓 Hard-Bypass Apple Signing
        # This script does 3 things:
        # 1. Renames the bundle ID globally
        # 2. Forces Manual Signing (Stops Xcode from asking for a Team)
        # 3. Wipes all Team and Profile IDs from the project file
        run: |
          find . -type f \( -name "*.pbxproj" -o -name "*.xml" -o -name "*.gradle" \) -exec sed -i '' 's/com.example.material3Counter/com.kimheng.btsecurechat/g' {} +
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          
          # Inject bypass directly into Flutter's internal build configs
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_IDENTITY=" >> ios/Flutter/Generated.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Generated.xcconfig

      - name: 🏗️ Build iOS (Unsigned)
        # We use '--' to pass raw Xcode arguments directly
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }} \
            -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""

      - name: 📦 Package IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 BT-SecureChat.ipa Payload
          
      - name: 🚀 Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/BT-SecureChat.ipa
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.ipa
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat Release
            - **Status:** Unsigned IPA (Build Successful)
            - **Target:** iOS 13.0+
            - **Installation:** Sideload via AltStore / Sideloadly.
