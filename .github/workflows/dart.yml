name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  # STEP 1: Check code quality before building (Saves build minutes)
  quality-check:
    name: 🧪 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze # Fails build if code has warnings/errors
      - run: flutter test # Fails build if logic tests fail

  # STEP 2: The actual build
  build-ios:
    name: 🎉 Build & Secure IPA
    needs: quality-check # Only runs if quality-check passes
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Install Pub Dependencies
        run: flutter pub get

      - name: 🍎 Setup CocoaPods
        run: cd ios && pod install
        working-directory: .

      - name: 🏗️ Build Obfuscated iOS App
        # --obfuscate: Hides logic from hackers
        # --build-number: Links app version to GitHub build ID
        run: |
          flutter build ios --release --no-codesign \
          --obfuscate --split-debug-info=build/app/outputs/symbols \
          --build-number=${{ github.run_number }} \
          --build-name=1.1.${{ github.run_number }}

      - name: 📦 Create IPA
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 BT-SecureChat-v${{ github.run_number }}.ipa Payload
        working-directory: build/ios/iphoneos

      - name: 🚀 Upload IPA to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/BT-SecureChat-v${{ github.run_number }}.ipa
          asset_name: BT-SecureChat-v${{ github.run_number }}.ipa
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 Secure Release v1.1.${{ github.run_number }}
            
            ### Security Features:
            - **Binary Obfuscation:** Enabled (AES logic protected)
            - **Build ID:** ${{ github.run_number }}
            - **Internal Build Name:** 1.1.${{ github.run_number }}
            
            ### Build Info:
            - Built with Flutter 3.22.2
            - Target: iOS 13.0+
            - Status: Unsigned / Sideload Ready

      - name: 📄 Archive Debug Symbols
        # Save this so you can read crash logs if the app crashes
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/app/outputs/symbols
