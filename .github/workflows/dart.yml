name: iOS-ipa-build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-ios:
    name: 🎉 iOS Release Build
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies & generate Xcode files
        run: |
          flutter pub get
          # --config-only generates Generated.xcconfig WITHOUT triggering a build
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}
          cd ios && pod install

      - name: 🔓 Patch signing AFTER Flutter config generation
        # Must run after flutter build --config-only so Generated.xcconfig exists
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          # Strip team & provisioning settings
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g'                    "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g'      "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;//g'                "$PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;//g'                  "$PBX"

          # Append to Generated.xcconfig (file now exists after --config-only)
          {
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGNING_IDENTITY="
            echo "DEVELOPMENT_TEAM="
          } >> ios/Flutter/Generated.xcconfig

          # Also patch the Flutter-specific xcconfig if present
          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            [ -f "$f" ] && {
              echo "CODE_SIGNING_ALLOWED=NO" >> "$f"
              echo "CODE_SIGNING_REQUIRED=NO" >> "$f"
            }
          done

      - name: 🏗️ Build with xcodebuild directly (bypasses Flutter re-patching)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.1.${{ github.run_number }} \
            build

      - name: 📦 Package IPA for sideloading
        run: |
          APP_PATH=$(find build/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qq -r -9 BT-SecureChat.ipa Payload

      - name: 🚀 Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat.ipa
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.ipa
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat Release
            - **Status:** Unsigned IPA (sideloadable)
            - **Installation:** AltStore, Sideloadly, or MapleSign
            - **Build:** 1.1.${{ github.run_number }}
