name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Release Build
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install
        working-directory: .

      - name: 🔓 Bypass Apple Signing & Rename
        # 1. Renames com.example to avoid Xcode blocking the build
        # 2. Injects CODE_SIGNING_ALLOWED=NO into the project file
        # 3. Strips Team ID requirements
        run: |
          find . -type f \( -name "*.pbxproj" -o -name "*.xml" -o -name "*.gradle" \) -exec sed -i '' 's/com.example.material3Counter/com.kimheng.btsecurechat/g' {} +
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' '/inline.*CODE_SIGNING_ALLOWED = YES;/d' ios/Runner.xcodeproj/project.pbxproj
          # Force the project to allow unsigned builds
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_IDENTITY=" >> ios/Flutter/Generated.xcconfig

      - name: 🏗️ Build iOS (Unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 📦 Package IPA for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 BT-SecureChat.ipa Payload
          
      - name: 🚀 Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/BT-SecureChat.ipa
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.ipa
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat Release
            - **Status:** Unsigned IPA (Success)
            - **Installation:** Use AltStore, Sideloadly, or MapleSign.
            - **Security:** AES-256 Obfuscated build.
