name: Android-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Android Release Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 📦 Install pub dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner (Hive code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ──────────────────────────────────────────────────────────────────
      # Patch old/abandoned packages that are missing `namespace` in their
      # build.gradle. AGP 8+ (used by Flutter 3.27) requires every Android
      # library module to declare a namespace. Old packages on pub.dev
      # predate this requirement and were never updated.
      #
      # We patch the files directly in the pub cache — this is safe because
      # the cache is local to this CI runner and thrown away after the job.
      #
      # Packages patched:
      #   • flutter_bluetooth_serial 0.4.0 — abandoned, no namespace
      # ──────────────────────────────────────────────────────────────────
      - name: 🔧 Patch legacy plugin namespaces for AGP 8+
        run: |
          PUB_CACHE="${HOME}/.pub-cache/hosted/pub.dev"

          patch_namespace() {
            local PACKAGE="$1"
            local NAMESPACE="$2"
            local BUILD_GRADLE=$(find "$PUB_CACHE" -path "*/${PACKAGE}-*/android/build.gradle" | head -1)

            if [ -z "$BUILD_GRADLE" ]; then
              echo "⚠️  $PACKAGE: build.gradle not found in pub cache — skipping"
              return
            fi

            # Check if namespace is already set
            if grep -q "namespace" "$BUILD_GRADLE"; then
              echo "✅ $PACKAGE: namespace already present — skipping"
              return
            fi

            # Inject namespace into the android { } block
            sed -i "s/^android {/android {\n    namespace '$NAMESPACE'/" "$BUILD_GRADLE"
            echo "✅ $PACKAGE: namespace '$NAMESPACE' injected into $BUILD_GRADLE"
          }

          # flutter_bluetooth_serial
          patch_namespace "flutter_bluetooth_serial" "io.github.edufolly.flutterbluetoothserial"

          # Patch any other packages that might hit the same issue
          patch_namespace "flutter_blue_plus"        "com.boskokg.flutter_blue_plus"
          patch_namespace "permission_handler_android" "com.baseflow.permissionhandler"
          patch_namespace "image_picker_android"     "io.flutter.plugins.imagepicker"
          patch_namespace "network_info_plus"        "dev.fluttercommunity.plus.network_info"

      # ──────────────────────────────────────────────────────────────────
      # Build APK
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      # ──────────────────────────────────────────────────────────────────
      # Build AAB (Play Store format)
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Build release AAB (Play Store)
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 📋 Rename build artifacts
        run: |
          VERSION="1.1.${{ github.run_number }}"

          cp build/app/outputs/flutter-apk/app-release.apk \
             BT-SecureChat-v${VERSION}.apk

          cp build/app/outputs/bundle/release/app-release.aab \
             BT-SecureChat-v${VERSION}.aab

          echo "✅ APK: $(du -sh BT-SecureChat-v${VERSION}.apk | cut -f1)"
          echo "✅ AAB: $(du -sh BT-SecureChat-v${VERSION}.aab | cut -f1)"

      - name: 🚀 Upload APK to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Android |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-*.apk` | Direct install (sideload) |
            | `BT-SecureChat-*.aab` | Google Play Store upload |

            ### Installation (APK)
            1. Enable **Install from unknown sources** in Android Settings
            2. Download and open the `.apk`

            ### Requirements
            - Android 6.0+ (API 21+)
            - Bluetooth LE support

      - name: 🚀 Upload AAB to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          tag: v1.1.${{ github.run_number }}
          overwrite: true
