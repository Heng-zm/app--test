name: Android-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Android Release Build
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────
      # 2. Java 17 — required by AGP (Android Gradle Plugin) 8.x
      # ──────────────────────────────────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ──────────────────────────────────────────────────────────────────
      # 3. Flutter 3.27.4 — required for Color.withValues()
      # ──────────────────────────────────────────────────────────────────
      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # ──────────────────────────────────────────────────────────────────
      # 4. Install pub dependencies
      # ──────────────────────────────────────────────────────────────────
      - name: 📦 Install pub dependencies
        run: flutter pub get

      # ──────────────────────────────────────────────────────────────────
      # 5. Generate Hive adapters (hive_generator in pubspec.yaml)
      # ──────────────────────────────────────────────────────────────────
      - name: ⚙️ Run build_runner (Hive code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ──────────────────────────────────────────────────────────────────
      # 6. Build release APK (sideloadable, direct install)
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      # ──────────────────────────────────────────────────────────────────
      # 7. Build release AAB (Google Play Store upload format)
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Build release AAB (Play Store)
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      # ──────────────────────────────────────────────────────────────────
      # 8. Rename artifacts with version number for clarity
      # ──────────────────────────────────────────────────────────────────
      - name: 📋 Rename build artifacts
        run: |
          VERSION="1.1.${{ github.run_number }}"

          cp build/app/outputs/flutter-apk/app-release.apk \
             BT-SecureChat-v${VERSION}.apk

          cp build/app/outputs/bundle/release/app-release.aab \
             BT-SecureChat-v${VERSION}.aab

          echo "✅ APK: $(du -sh BT-SecureChat-v${VERSION}.apk | cut -f1)"
          echo "✅ AAB: $(du -sh BT-SecureChat-v${VERSION}.aab | cut -f1)"

      # ──────────────────────────────────────────────────────────────────
      # 9. Upload APK to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload APK to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Android |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-*.apk` | Direct install (sideload) |
            | `BT-SecureChat-*.aab` | Google Play Store upload |

            ### Installation (APK)
            1. Enable **Install from unknown sources** in Android Settings
            2. Download and open the `.apk`

            ### Requirements
            - Android 6.0+ (API 23+)
            - Bluetooth LE support

      # ──────────────────────────────────────────────────────────────────
      # 10. Upload AAB to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload AAB to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          tag: v1.1.${{ github.run_number }}
          overwrite: true
