name: Android-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Android Release Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 📦 Install pub dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner (Hive code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ──────────────────────────────────────────────────────────────────
      # Patch legacy plugins in the pub cache.
      # Problems fixed per plugin:
      #
      #   flutter_bluetooth_serial 0.4.0 (abandoned):
      #     1. Missing `namespace`  → AGP 8+ rejects it
      #     2. compileSdkVersion 30 → android:attr/lStar requires SDK 31+
      #
      # All other plugins are patched defensively for namespace only,
      # in case their cached version also predates AGP 8.
      # ──────────────────────────────────────────────────────────────────
      - name: 🔧 Patch legacy plugin build.gradle files for AGP 8+
        run: |
          PUB_CACHE="${HOME}/.pub-cache/hosted/pub.dev"

          # ── Helper: inject namespace if missing ───────────────────────
          patch_namespace() {
            local PACKAGE="$1"
            local NAMESPACE="$2"
            local BUILD_GRADLE
            BUILD_GRADLE=$(find "$PUB_CACHE" -path "*/${PACKAGE}-*/android/build.gradle" | head -1)

            if [ -z "$BUILD_GRADLE" ]; then
              echo "⚠️  $PACKAGE: not found in pub cache — skipping"
              return
            fi
            if grep -q "namespace" "$BUILD_GRADLE"; then
              echo "✅ $PACKAGE: namespace already present"
            else
              sed -i "s/^android {/android {\n    namespace '$NAMESPACE'/" "$BUILD_GRADLE"
              echo "✅ $PACKAGE: namespace '$NAMESPACE' injected"
            fi
          }

          # ── Helper: bump compileSdkVersion to 35 ─────────────────────
          patch_compile_sdk() {
            local PACKAGE="$1"
            local BUILD_GRADLE
            BUILD_GRADLE=$(find "$PUB_CACHE" -path "*/${PACKAGE}-*/android/build.gradle" | head -1)

            if [ -z "$BUILD_GRADLE" ]; then
              echo "⚠️  $PACKAGE: not found in pub cache — skipping"
              return
            fi
            # Replace compileSdkVersion XX or compileSdk = XX with 35
            sed -i \
              -e 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' \
              -e 's/compileSdk = [0-9]*/compileSdk = 35/' \
              "$BUILD_GRADLE"
            echo "✅ $PACKAGE: compileSdk bumped to 35"
          }

          # ── flutter_bluetooth_serial: namespace + compileSdk fix ───────
          patch_namespace   "flutter_bluetooth_serial" "io.github.edufolly.flutterbluetoothserial"
          patch_compile_sdk "flutter_bluetooth_serial"

          # ── Other plugins: namespace only (defensive) ─────────────────
          patch_namespace "flutter_blue_plus"           "com.boskokg.flutter_blue_plus"
          patch_namespace "permission_handler_android"  "com.baseflow.permissionhandler"
          patch_namespace "image_picker_android"        "io.flutter.plugins.imagepicker"
          patch_namespace "network_info_plus"           "dev.fluttercommunity.plus.network_info"
          patch_namespace "device_info_plus"            "dev.fluttercommunity.plus.device_info"
          patch_namespace "path_provider_android"       "io.flutter.plugins.pathprovider"
          patch_namespace "shared_preferences_android"  "io.flutter.plugins.sharedpreferences"

      - name: 🏗️ Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 🏗️ Build release AAB (Play Store)
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 📋 Rename build artifacts
        run: |
          VERSION="1.1.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk   BT-SecureChat-v${VERSION}.apk
          cp build/app/outputs/bundle/release/app-release.aab BT-SecureChat-v${VERSION}.aab
          echo "✅ APK: $(du -sh BT-SecureChat-v${VERSION}.apk | cut -f1)"
          echo "✅ AAB: $(du -sh BT-SecureChat-v${VERSION}.aab | cut -f1)"

      - name: 🚀 Upload APK to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.apk
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Android |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-*.apk` | Direct install (sideload) |
            | `BT-SecureChat-*.aab` | Google Play Store upload |

            ### Installation (APK)
            1. Enable **Install from unknown sources** in Android Settings
            2. Download and open the `.apk`

            ### Requirements
            - Android 5.0+ (API 21+)
            - Bluetooth LE support

      - name: 🚀 Upload AAB to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          asset_name: BT-SecureChat-v1.1.${{ github.run_number }}.aab
          tag: v1.1.${{ github.run_number }}
          overwrite: true
