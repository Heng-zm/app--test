name: SpeedCharge-Windows-Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🎉 Build SpeedCharge (Windows EXE)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 🖥️ Enable Windows desktop & create project
        shell: pwsh
        run: |
          # Must enable BEFORE create/build
          flutter config --enable-windows-desktop

          # Verify config took effect
          flutter config | Select-String "windows"

          # Scaffold windows/ folder if not committed in repo
          if (-Not (Test-Path "windows")) {
            Write-Host "⚠️ windows/ not found — scaffolding now..."
            flutter create --platforms=windows --project-name speedcharge .
            Write-Host "✅ windows/ created."
          } else {
            Write-Host "✅ windows/ already present."
          }

          # Hard-fail if still missing after create
          if (-Not (Test-Path "windows\CMakeLists.txt")) {
            Write-Error "❌ windows/CMakeLists.txt still missing after flutter create!"
            exit 1
          }
          Write-Host "✅ windows/CMakeLists.txt confirmed."

      - name: 📦 Install pub dependencies
        run: flutter pub get

      - name: 📁 Ensure assets folder exists
        shell: pwsh
        run: |
          if (-Not (Test-Path "assets")) {
            New-Item -ItemType Directory -Path "assets" | Out-Null
            New-Item -ItemType File    -Path "assets\.keep" | Out-Null
            Write-Host "✅ Created assets/ placeholder."
          }

      - name: ⚙️ Run build_runner (Code Gen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🏗️ Build Windows app (Release)
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.1.${{ github.run_number }}

      - name: 📦 Package as ZIP
        shell: pwsh
        run: |
          $appPath = "build\windows\x64\runner\Release"
          if (-Not (Test-Path $appPath)) {
            Write-Error "❌ Release folder not found: $appPath"
            exit 1
          }
          Compress-Archive -Path "$appPath\*" -DestinationPath "SpeedCharge-Windows.zip" -Force
          Write-Host "✅ SpeedCharge-Windows.zip created."

      - name: 🚀 Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: SpeedCharge-Windows.zip
          asset_name: SpeedCharge-Windows-v1.1.${{ github.run_number }}.zip
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## ⚡ SpeedCharge — Build ${{ github.run_number }}

            **Platform:** Windows (x64)
            **Version:** 1.1.${{ github.run_number }}
            **Flutter:** 3.27.4

            ### ℹ️ Installation
            1. Download and extract the ZIP
            2. Run **SpeedCharge.exe** — no installer needed

            ### ⚠️ Requirements
            - Windows 10 1903+ (64-bit)
            - Visual C++ Redistributable 2019+
