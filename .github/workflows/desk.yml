name: Windows-exe-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────
      # 2. Flutter 3.27.4 — required for Color.withValues()
      # ──────────────────────────────────────────────────────────────────
      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # ──────────────────────────────────────────────────────────────────
      # 3. All Flutter setup + windows/ init + build in ONE shell.
      #
      #    Root cause of "No Windows desktop project configured":
      #    - flutter config --enable-windows-desktop writes to the Flutter
      #      tool's config file but each `run:` block spawns a fresh shell.
      #    - flutter create --platforms=windows adds the windows/ folder
      #      but if flutter config hasn't fully settled in the same process
      #      the subsequent build step still sees no windows project.
      #
      #    Fix: run config → create → pub get → build_runner → build
      #    all inside a single `run:` block so there is zero shell gap.
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Configure, init & build Windows app
        shell: pwsh
        run: |
          # ── 1. Enable Windows desktop support ─────────────────────────
          flutter config --enable-windows-desktop
          Write-Host "✅ Windows desktop enabled."

          # ── 2. Install pub dependencies ───────────────────────────────
          flutter pub get
          Write-Host "✅ pub get done."

          # ── 3. Create windows/ folder if missing ──────────────────────
          #    `flutter create --platforms=windows .` is safe to run even
          #    if windows/ already exists — it only adds missing files and
          #    never overwrites your existing Dart source code.
          flutter create --platforms=windows .
          Write-Host "✅ windows/ folder ensured."

          # ── 4. Patch app name in CMakeLists.txt ───────────────────────
          $cmake = "windows\runner\CMakeLists.txt"
          if (Test-Path $cmake) {
            (Get-Content $cmake) `
              -replace 'set\(BINARY_NAME "[^"]*"\)',    'set(BINARY_NAME "bluetooth_chat")' `
              -replace 'set\(APPLICATION_ID "[^"]*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
            Set-Content $cmake
            Write-Host "✅ CMakeLists.txt patched."
          }

          # ── 5. Generate Hive adapters (hive_generator in pubspec.yaml) ─
          flutter pub run build_runner build --delete-conflicting-outputs
          Write-Host "✅ build_runner done."

          # ── 6. Build Windows release ───────────────────────────────────
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.1.${{ github.run_number }}
          Write-Host "✅ Flutter Windows build complete."

          # ── 7. Verify .exe was produced ────────────────────────────────
          $releaseDir = "build\windows\x64\runner\Release"
          if (!(Test-Path $releaseDir)) {
            Write-Host "❌ Release dir not found: $releaseDir"
            Get-ChildItem -Recurse build\ | Select-Object FullName
            exit 1
          }
          $exe = Get-ChildItem "$releaseDir\*.exe" | Select-Object -First 1
          if (!$exe) {
            Write-Host "❌ No .exe found in $releaseDir"
            exit 1
          }
          Write-Host "✅ EXE: $($exe.FullName) ($('{0:N2}' -f ($exe.Length/1MB)) MB)"

      # ──────────────────────────────────────────────────────────────────
      # 4. Install NSIS
      # ──────────────────────────────────────────────────────────────────
      - name: 📥 Install NSIS
        run: choco install nsis --yes

      # ──────────────────────────────────────────────────────────────────
      # 5. Write + compile NSIS installer script
      # ──────────────────────────────────────────────────────────────────
      - name: 🔨 Create NSIS installer
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"

          # Use @'...'@ (single-quote heredoc) so $ chars are NOT expanded
          $script = @'
          Unicode true
          !define APP_NAME    "BT SecureChat"
          !define APP_VERSION "APPVER"
          !define APP_EXE     "bluetooth_chat.exe"
          !define BUILD_DIR   "build\windows\x64\runner\Release"

          Name            "${APP_NAME} ${APP_VERSION}"
          OutFile         "BT-SecureChat-Setup-vAPPVER.exe"
          InstallDir      "$PROGRAMFILES64\BT SecureChat"
          InstallDirRegKey HKLM "Software\BT SecureChat" "Install_Dir"
          RequestExecutionLevel admin
          SetCompressor lzma

          Page directory
          Page instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\BT SecureChat"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"     "$INSTDIR\Uninstall.exe"
            CreateShortcut  "$DESKTOP\BT SecureChat.lnk"                  "$INSTDIR\${APP_EXE}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayName"     "BT SecureChat"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "UninstallString" "$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayVersion"  "${APP_VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "Publisher"       "BT SecureChat"
          SectionEnd

          Section "Uninstall"
            RMDir  /r "$INSTDIR"
            Delete "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk"
            Delete "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"
            RMDir  "$SMPROGRAMS\BT SecureChat"
            Delete "$DESKTOP\BT SecureChat.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat"
            DeleteRegKey HKLM "Software\BT SecureChat"
          SectionEnd
          '@

          # Substitute version placeholder (safe — no $ conflicts)
          $script = $script -replace 'APPVER', $version
          $script | Out-File -FilePath "installer.nsi" -Encoding UTF8
          Write-Host "✅ installer.nsi written."

          # Compile
          makensis installer.nsi
          Write-Host "✅ NSIS installer compiled."

      # ──────────────────────────────────────────────────────────────────
      # 6. Package portable ZIP
      # ──────────────────────────────────────────────────────────────────
      - name: 📦 Package portable ZIP
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          $src  = "build\windows\x64\runner\Release"
          $dest = "BT-SecureChat-Portable-v$version.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dest
          Write-Host "✅ $dest ($('{0:N2}' -f ((Get-Item $dest).Length/1MB)) MB)"

      # ──────────────────────────────────────────────────────────────────
      # 7. Upload Setup EXE to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload Setup EXE to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          asset_name: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Windows x64 |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-Setup-*.exe` | Installer with shortcuts + uninstaller |
            | `BT-SecureChat-Portable-*.zip` | Portable — unzip and run, no install needed |

            ### Requirements
            - Windows 10 / 11 (x64)
            - No additional runtime required

      # ──────────────────────────────────────────────────────────────────
      # 8. Upload Portable ZIP to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload Portable ZIP to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          asset_name: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          tag: v1.1.${{ github.run_number }}
          overwrite: true
