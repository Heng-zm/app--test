name: Windows-exe-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 🔧 Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 🔧 Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 🏗️ Configure, init & build Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Enable Windows desktop
          Write-Host "==> flutter config --enable-windows-desktop"
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw "flutter config failed" }

          # 2. First pub get
          Write-Host "==> flutter pub get"
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed" }

          # 3. Create windows/ folder
          Write-Host "==> flutter create --platforms=windows ."
          flutter create --platforms=windows .
          if ($LASTEXITCODE -ne 0) { throw "flutter create failed" }

          if (!(Test-Path "windows\CMakeLists.txt")) {
            throw "windows\CMakeLists.txt missing after flutter create"
          }
          Write-Host "✅ windows\ folder created"

          # Patch app name
          $cmake = "windows\runner\CMakeLists.txt"
          if (Test-Path $cmake) {
            (Get-Content $cmake) `
              -replace 'set\(BINARY_NAME "[^"]*"\)',    'set(BINARY_NAME "bluetooth_chat")' `
              -replace 'set\(APPLICATION_ID "[^"]*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
            Set-Content $cmake
            Write-Host "✅ CMakeLists.txt patched"
          }

          # 4. Second pub get
          Write-Host "==> flutter pub get (second)"
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get second failed" }

          # 5. Manually create plugin symlinks.
          #    flutter pub get does NOT create .plugin_symlinks on Windows CI —
          #    it only does so during `flutter run` or when a build tool triggers
          #    the ephemeral directory generation. We do it ourselves here by
          #    finding each Windows plugin in the pub cache and linking it.
          $symlinksDir = "windows\flutter\ephemeral\.plugin_symlinks"
          New-Item -ItemType Directory -Force -Path $symlinksDir | Out-Null
          Write-Host "==> Creating plugin symlinks in $symlinksDir"

          $pubCache = $env:PUB_CACHE
          if (!$pubCache) { $pubCache = "$env:LOCALAPPDATA\Pub\Cache" }
          $hostedDir = Join-Path $pubCache "hosted\pub.dev"
          Write-Host "Pub cache hosted dir: $hostedDir"

          # Windows plugins that ship a /windows CMake folder
          $windowsPlugins = @(
            "permission_handler_windows",
            "shared_preferences_windows",
            "path_provider_windows",
            "flutter_blue_plus_windows"
          )

          foreach ($plugin in $windowsPlugins) {
            # Find the installed version folder (e.g. permission_handler_windows-0.2.1)
            $pluginDir = Get-ChildItem $hostedDir -Directory |
                           Where-Object { $_.Name -like "$plugin-*" } |
                           Sort-Object Name -Descending |
                           Select-Object -First 1

            if ($pluginDir) {
              $linkPath = Join-Path $symlinksDir $plugin
              if (!(Test-Path $linkPath)) {
                # Create a directory junction (works without admin on Windows CI)
                cmd /c mklink /J "$linkPath" "$($pluginDir.FullName)" 2>&1
                Write-Host "✅ Linked: $plugin -> $($pluginDir.FullName)"
              } else {
                Write-Host "ℹ️  Already exists: $plugin"
              }
            } else {
              Write-Host "⚠️  Plugin not found in cache: $plugin (may not be needed on Windows)"
            }
          }

          Write-Host "Plugin symlinks created:"
          Get-ChildItem $symlinksDir | Select-Object Name, LinkType, Target

          # 6. Hive code generation
          Write-Host "==> build_runner"
          flutter pub run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { throw "build_runner failed" }

          # 7. Build
          Write-Host "==> flutter build windows --release"
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.1.${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed" }

          # 8. Find .exe and export path
          $exe = Get-ChildItem -Recurse "build\windows" -Filter "*.exe" |
                   Where-Object { $_.DirectoryName -match "Release" -and $_.Name -notmatch "Uninstall" } |
                   Select-Object -First 1

          if (!$exe) {
            Write-Host "❌ No .exe found. Build tree:"
            Get-ChildItem -Recurse "build\windows" | Select-Object FullName
            throw "EXE not found after build"
          }

          Write-Host "✅ EXE: $($exe.FullName) ($('{0:N2}' -f ($exe.Length/1MB)) MB)"
          "RELEASE_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📥 Install NSIS
        run: choco install nsis --yes

      - name: 🔨 Create NSIS installer
        shell: pwsh
        run: |
          $version    = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          Write-Host "Packaging from: $releaseDir"

          $script = @'
          Unicode true
          !define APP_NAME    "BT SecureChat"
          !define APP_VERSION "APPVER"
          !define APP_EXE     "bluetooth_chat.exe"
          !define BUILD_DIR   "BUILDDIR"

          Name            "${APP_NAME} ${APP_VERSION}"
          OutFile         "BT-SecureChat-Setup-vAPPVER.exe"
          InstallDir      "$PROGRAMFILES64\BT SecureChat"
          InstallDirRegKey HKLM "Software\BT SecureChat" "Install_Dir"
          RequestExecutionLevel admin
          SetCompressor lzma

          Page directory
          Page instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\BT SecureChat"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"     "$INSTDIR\Uninstall.exe"
            CreateShortcut  "$DESKTOP\BT SecureChat.lnk"                  "$INSTDIR\${APP_EXE}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayName"     "BT SecureChat"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "UninstallString" "$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayVersion"  "${APP_VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "Publisher"       "BT SecureChat"
          SectionEnd

          Section "Uninstall"
            RMDir  /r "$INSTDIR"
            Delete "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk"
            Delete "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"
            RMDir  "$SMPROGRAMS\BT SecureChat"
            Delete "$DESKTOP\BT SecureChat.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat"
            DeleteRegKey HKLM "Software\BT SecureChat"
          SectionEnd
          '@

          $script = $script -replace 'APPVER',   $version
          $script = $script -replace 'BUILDDIR',  $releaseDir
          $script | Out-File -FilePath "installer.nsi" -Encoding UTF8

          makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Write-Host "✅ Installer: BT-SecureChat-Setup-v$version.exe"

      - name: 📦 Package portable ZIP
        shell: pwsh
        run: |
          $version    = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          $dest       = "BT-SecureChat-Portable-v$version.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $dest
          Write-Host "✅ $dest ($('{0:N2}' -f ((Get-Item $dest).Length/1MB)) MB)"

      - name: 🚀 Upload Setup EXE to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          asset_name: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Windows x64 |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-Setup-*.exe` | Installer — shortcuts + uninstaller |
            | `BT-SecureChat-Portable-*.zip` | Portable — unzip and run |

            ### Requirements
            - Windows 10 / 11 (x64)
            - No additional runtime required

      - name: 🚀 Upload Portable ZIP to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          asset_name: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          tag: v1.1.${{ github.run_number }}
          overwrite: true
