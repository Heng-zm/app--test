name: Windows-exe-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────
      # 2. Flutter 3.27.4 — required for Color.withValues()
      # ──────────────────────────────────────────────────────────────────
      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # ──────────────────────────────────────────────────────────────────
      # 3. Enable Windows desktop support
      # ──────────────────────────────────────────────────────────────────
      - name: 🖥️ Enable Flutter Windows desktop
        run: flutter config --enable-windows-desktop

      # ──────────────────────────────────────────────────────────────────
      # 4. Install pub dependencies
      # ──────────────────────────────────────────────────────────────────
      - name: 📦 Install pub dependencies
        run: flutter pub get

      # ──────────────────────────────────────────────────────────────────
      # 5. Create the windows/ folder if it doesn't exist in the repo.
      #    Your repo was created without `flutter create --platforms=windows`
      #    so the windows/ directory is missing. `flutter create .` adds it
      #    without touching any of your existing Dart source files.
      # ──────────────────────────────────────────────────────────────────
      - name: 🪟 Initialize Windows desktop project
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            Write-Host "windows/ folder not found — creating it now..."
            flutter create --platforms=windows .
            Write-Host "✅ windows/ folder created."
          } else {
            Write-Host "✅ windows/ folder already exists — skipping."
          }

      # ──────────────────────────────────────────────────────────────────
      # 6. Patch the Windows runner app name & company in CMakeLists.txt
      #    flutter create uses generic placeholder values — we fix them here
      # ──────────────────────────────────────────────────────────────────
      - name: ✏️ Patch Windows app metadata
        shell: pwsh
        run: |
          $cmake = "windows\runner\CMakeLists.txt"
          if (Test-Path $cmake) {
            (Get-Content $cmake) `
              -replace 'set\(BINARY_NAME ".*"\)',   'set(BINARY_NAME "bluetooth_chat")' `
              -replace 'set\(APPLICATION_ID ".*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
            Set-Content $cmake
            Write-Host "✅ CMakeLists.txt patched."
          }

          $mainCpp = "windows\runner\main.cpp"
          if (Test-Path $mainCpp) {
            (Get-Content $mainCpp) `
              -replace '"flutter_windows_example"', '"BT SecureChat"' `
              -replace '"Flutter Windows Example"',  '"BT SecureChat"' |
            Set-Content $mainCpp
            Write-Host "✅ main.cpp patched."
          }

      # ──────────────────────────────────────────────────────────────────
      # 7. Generate Hive adapters (hive_generator in your pubspec.yaml)
      # ──────────────────────────────────────────────────────────────────
      - name: ⚙️ Run build_runner (Hive code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ──────────────────────────────────────────────────────────────────
      # 8. Build Windows release
      #    Output: build\windows\x64\runner\Release\
      # ──────────────────────────────────────────────────────────────────
      - name: 🏗️ Build Windows app
        run: |
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.1.${{ github.run_number }}

      # ──────────────────────────────────────────────────────────────────
      # 9. Verify build output exists before packaging
      # ──────────────────────────────────────────────────────────────────
      - name: ✅ Verify build output
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (!(Test-Path $releaseDir)) {
            Write-Host "❌ Release folder not found at: $releaseDir"
            Write-Host "Listing build\ tree:"
            Get-ChildItem -Recurse build\ -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          $exe = Get-ChildItem "$releaseDir\*.exe" | Select-Object -First 1
          if (!$exe) {
            Write-Host "❌ No .exe found in $releaseDir"
            exit 1
          }
          Write-Host "✅ Found: $($exe.FullName)"

      # ──────────────────────────────────────────────────────────────────
      # 10. Install NSIS
      # ──────────────────────────────────────────────────────────────────
      - name: 📥 Install NSIS
        run: choco install nsis --yes

      # ──────────────────────────────────────────────────────────────────
      # 11. Write NSIS installer script
      #     Produces a setup wizard with:
      #       • Install to Program Files\BT SecureChat
      #       • Start Menu shortcut
      #       • Desktop shortcut
      #       • Uninstaller registered in Add/Remove Programs
      # ──────────────────────────────────────────────────────────────────
      - name: 📝 Generate NSIS installer script
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          $script = @'
          Unicode true
          !define APP_NAME      "BT SecureChat"
          !define APP_VERSION   "APP_VER_PLACEHOLDER"
          !define APP_EXE       "bluetooth_chat.exe"
          !define INSTALL_DIR   "$PROGRAMFILES64\BT SecureChat"
          !define BUILD_DIR     "build\windows\x64\runner\Release"

          Name            "${APP_NAME} ${APP_VERSION}"
          OutFile         "BT-SecureChat-Setup-vAPP_VER_PLACEHOLDER.exe"
          InstallDir      "${INSTALL_DIR}"
          InstallDirRegKey HKLM "Software\BT SecureChat" "Install_Dir"
          RequestExecutionLevel admin
          SetCompressor    lzma

          Page directory
          Page instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"

            WriteUninstaller "$INSTDIR\Uninstall.exe"

            CreateDirectory "$SMPROGRAMS\BT SecureChat"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"     "$INSTDIR\Uninstall.exe"
            CreateShortcut  "$DESKTOP\BT SecureChat.lnk"                  "$INSTDIR\${APP_EXE}"

            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayName"     "BT SecureChat"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "UninstallString" "$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayVersion"  "${APP_VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "Publisher"       "BT SecureChat"
          SectionEnd

          Section "Uninstall"
            RMDir  /r "$INSTDIR"
            Delete "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk"
            Delete "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"
            RMDir  "$SMPROGRAMS\BT SecureChat"
            Delete "$DESKTOP\BT SecureChat.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat"
            DeleteRegKey HKLM "Software\BT SecureChat"
          SectionEnd
          '@

          # Substitute version placeholder safely (avoids $ interpolation issues)
          $script = $script -replace 'APP_VER_PLACEHOLDER', $version
          $script | Out-File -FilePath "installer.nsi" -Encoding UTF8
          Write-Host "✅ NSIS script written for version $version"

      # ──────────────────────────────────────────────────────────────────
      # 12. Compile NSIS installer
      # ──────────────────────────────────────────────────────────────────
      - name: 🔨 Compile NSIS installer
        run: makensis installer.nsi

      # ──────────────────────────────────────────────────────────────────
      # 13. Package portable ZIP (unzip and run, no install needed)
      # ──────────────────────────────────────────────────────────────────
      - name: 📦 Package portable ZIP
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          $src  = "build\windows\x64\runner\Release"
          $dest = "BT-SecureChat-Portable-v$version.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dest
          $sizeMB = '{0:N2}' -f ((Get-Item $dest).Length / 1MB)
          Write-Host "✅ Portable ZIP: $dest ($sizeMB MB)"

      # ──────────────────────────────────────────────────────────────────
      # 14. Upload Setup installer to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload Setup EXE to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          asset_name: BT-SecureChat-Setup-v1.1.${{ github.run_number }}.exe
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | Windows x64 |
            | Flutter | 3.27.4 |
            | Encryption | AES-256 |
            | Build | ${{ github.run_number }} |

            ### Downloads
            | File | Description |
            |---|---|
            | `BT-SecureChat-Setup-*.exe` | Installer — Start Menu + Desktop shortcuts + uninstaller |
            | `BT-SecureChat-Portable-*.zip` | Portable — unzip and run, no install needed |

            ### Requirements
            - Windows 10 / 11 (x64)
            - No additional runtime required

      # ──────────────────────────────────────────────────────────────────
      # 15. Upload Portable ZIP to GitHub Releases
      # ──────────────────────────────────────────────────────────────────
      - name: 🚀 Upload Portable ZIP to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          asset_name: BT-SecureChat-Portable-v1.1.${{ github.run_number }}.zip
          tag: v1.1.${{ github.run_number }}
          overwrite: true
