name: Windows-exe-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔗 Enable Symlinks & Developer Mode
        shell: pwsh
        run: |
          git config --global core.symlinks true
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v "AllowDevelopmentWithoutDevLicense" /t REG_DWORD /d 1 /f

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 🏗️ Prepare & Build Windows App
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Force enable windows and REPAIR the project files
          # This fixes the "No Windows desktop project configured" error
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          
          flutter pub get

          # 2. Run code generation
          flutter pub run build_runner build --delete-conflicting-outputs

          # 3. Patch CMakeLists.txt for Binary Name and App ID
          $cmake = "windows\runner\CMakeLists.txt"
          if (Test-Path $cmake) {
            (Get-Content $cmake) `
              -replace 'set\(BINARY_NAME "[^"]*"\)',    'set(BINARY_NAME "bluetooth_chat")' `
              -replace 'set\(APPLICATION_ID "[^"]*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
            Set-Content $cmake
            Write-Host "✅ CMakeLists.txt patched"
          }

          # 4. Build the application
          flutter build windows --release `
            --build-number=${{ github.run_number }} `
            --build-name=1.1.${{ github.run_number }}

          # 5. Export the build path
          $exe = Get-ChildItem -Recurse "build\windows" -Filter "bluetooth_chat.exe" |
                 Where-Object { $_.DirectoryName -match "Release" } |
                 Select-Object -First 1

          if (!$exe) { throw "Build failed: bluetooth_chat.exe not found" }
          Write-Host "✅ Found EXE at: $($exe.FullName)"
          "RELEASE_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📥 Install NSIS
        run: choco install nsis --yes

      - name: 🔨 Create NSIS installer
        shell: pwsh
        run: |
          $version    = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          
          # Using single-quote here-string (@' ... '@) so PowerShell doesn't expand $ symbols
          $script = @'
          Unicode true
          !define APP_NAME    "BT SecureChat"
          !define APP_VERSION "APPVER"
          !define APP_EXE      "bluetooth_chat.exe"
          !define BUILD_DIR    "BUILDDIR"
          !define PUBLISHER    "Ozo.Designer"

          Name           "${APP_NAME} ${APP_VERSION}"
          OutFile        "BT-SecureChat-Setup-v${APP_VERSION}.exe"
          InstallDir     "$PROGRAMFILES64\BT SecureChat"
          InstallDirRegKey HKLM "Software\BT SecureChat" "Install_Dir"
          RequestExecutionLevel admin
          SetCompressor lzma

          Page directory
          Page instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateDirectory "$SMPROGRAMS\BT SecureChat"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
            CreateShortcut  "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"     "$INSTDIR\Uninstall.exe"
            CreateShortcut  "$DESKTOP\BT SecureChat.lnk"                  "$INSTDIR\${APP_EXE}"
            
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayName"     "${APP_NAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "UninstallString" "$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayVersion"  "${APP_VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "Publisher"       "${PUBLISHER}"
          SectionEnd

          Section "Uninstall"
            RMDir  /r "$INSTDIR"
            Delete "$SMPROGRAMS\BT SecureChat\BT SecureChat.lnk"
            Delete "$SMPROGRAMS\BT SecureChat\Uninstall.lnk"
            RMDir  "$SMPROGRAMS\BT SecureChat"
            Delete "$DESKTOP\BT SecureChat.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat"
            DeleteRegKey HKLM "Software\BT SecureChat"
          SectionEnd
          '@

          # Manually replace placeholders to avoid PowerShell escaping issues
          $script = $script -replace 'APPVER', $version
          $script = $script -replace 'BUILDDIR', $releaseDir
          $script | Out-File -FilePath "installer.nsi" -Encoding UTF8
          
          makensis installer.nsi
          Write-Host "✅ Installer created."

      - name: 📦 Package portable ZIP
        shell: pwsh
        run: |
          $version    = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          $dest       = "BT-SecureChat-Portable-v$version.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $dest

      - name: 🚀 Upload Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-*
          file_glob: true
          tag: v1.1.${{ github.run_number }}
          overwrite: true
          body: |
            ## 🔒 BT SecureChat — v1.1.${{ github.run_number }}
            Developed by **Ozo.Designer**
