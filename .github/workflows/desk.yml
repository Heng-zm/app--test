name: Windows-exe-build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔗 Enable Symlinks & Developer Mode
        shell: pwsh
        run: |
          git config --global core.symlinks true
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v "AllowDevelopmentWithoutDevLicense" /t REG_DWORD /d 1 /f

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 🏗️ Prepare, Patch & Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Enable Windows desktop support
          flutter config --enable-windows-desktop

          # 2. Scaffold Windows platform files (does NOT run pub get yet)
          flutter create --platforms=windows .

          # 3. Fetch dependencies AFTER create so plugin symlinks are resolved correctly
          flutter pub get

          # 4. Upgrade permission_handler_windows explicitly to ensure its
          #    windows/ directory is fully materialized in .plugin_symlinks
          flutter pub upgrade permission_handler_windows

          # 5. Run build_runner
          flutter pub run build_runner build --delete-conflicting-outputs

          # 6. Patch CMakeLists.txt (Binary Name & App ID)
          $cmakeMain = "windows\runner\CMakeLists.txt"
          (Get-Content $cmakeMain) `
            -replace 'set\(BINARY_NAME "[^"]*"\)',    'set(BINARY_NAME "bluetooth_chat")' `
            -replace 'set\(APPLICATION_ID "[^"]*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
          Set-Content $cmakeMain

          # 7. Verify the plugin symlink actually exists before building
          $pluginDir = "windows\flutter\ephemeral\.plugin_symlinks\permission_handler_windows\windows"
          if (-not (Test-Path $pluginDir)) {
            Write-Host "❌ Plugin directory still missing: $pluginDir"
            Write-Host "Listing .plugin_symlinks for debug:"
            Get-ChildItem -Recurse "windows\flutter\ephemeral\.plugin_symlinks" | Select-Object FullName
            throw "permission_handler_windows plugin directory not found. Check pubspec.yaml dependency."
          }
          Write-Host "✅ Plugin dir confirmed: $pluginDir"

          # 8. Build Windows app
          Write-Host "==> Running flutter build windows..."
          flutter build windows --release

          # 9. Search for the output EXE
          Write-Host "==> Searching for EXE..."
          $exe = Get-ChildItem -Recurse "build\windows" -Filter "bluetooth_chat.exe" |
                 Where-Object { $_.FullName -match "Release" } |
                 Select-Object -First 1

          if (!$exe) {
            Write-Host "❌ EXE not found. Listing build directory for debug:"
            Get-ChildItem -Recurse "build\windows" | Select-Object FullName
            throw "Build failed: Executable not found."
          }

          Write-Host "✅ Found: $($exe.FullName)"
          "RELEASE_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📥 Install NSIS
        run: choco install nsis --yes

      - name: 🔨 Create NSIS installer
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          $script = @'
          Unicode true
          !define APP_NAME    "BT SecureChat"
          !define APP_VERSION "APPVER"
          !define APP_EXE      "bluetooth_chat.exe"
          !define BUILD_DIR    "BUILDDIR"
          !define PUBLISHER    "Ozo.Designer"
          Name           "${APP_NAME} ${APP_VERSION}"
          OutFile        "BT-SecureChat-Setup-v${APP_VERSION}.exe"
          InstallDir     "$PROGRAMFILES64\BT SecureChat"
          RequestExecutionLevel admin
          SetCompressor lzma
          Page directory
          Page instfiles
          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortcut "$DESKTOP\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
          SectionEnd
          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$DESKTOP\BT SecureChat.lnk"
          SectionEnd
          '@
          $script = $script -replace 'APPVER', $version -replace 'BUILDDIR', $releaseDir
          $script | Out-File "installer.nsi" -Encoding UTF8
          makensis installer.nsi

      - name: 🚀 Upload
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-Setup-v*
          file_glob: true
          tag: v1.1.${{ github.run_number }}
          overwrite: true
