name: Windows-exe-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Release Build
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔗 Enable Symlinks & Developer Mode
        shell: pwsh
        run: |
          git config --global core.symlinks true
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v "AllowDevelopmentWithoutDevLicense" /t REG_DWORD /d 1 /f

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: 🏗️ Prepare, Patch & Manual Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Initialize Flutter project
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

          # 2. Patch CMakeLists.txt (Standard Setup)
          $cmakeMain = "windows\runner\CMakeLists.txt"
          (Get-Content $cmakeMain) `
            -replace 'set\(BINARY_NAME "[^"]*"\)',    'set(BINARY_NAME "bluetooth_chat")' `
            -replace 'set\(APPLICATION_ID "[^"]*"\)', 'set(APPLICATION_ID "com.kimheng.btsecurechat")' |
          Set-Content $cmakeMain

          # 3. Generate Build Files (This creates the ephemeral folder)
          # We use the raw cmake command so we can intercept the plugins file
          $buildDir = "build/windows/x64"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          
          Write-Host "==> Generating CMake project..."
          cmake -S windows -B $buildDir -G "Visual Studio 17 2022" -A x64 -DFLUTTER_TARGET_PLATFORM=windows-x64

          # 4. THE FIX: Patch generated_plugins.cmake to use Absolute Paths
          # This prevents the "directory not found" symlink error
          $genPlugins = "windows\flutter\ephemeral\generated_plugins.cmake"
          if (!(Test-Path $genPlugins)) { 
             $genPlugins = Get-ChildItem -Recurse -Filter "generated_plugins.cmake" | Select-Object -First 1 -ExpandProperty FullName
          }

          Write-Host "✅ Patching: $genPlugins"
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:USERPROFILE\.pub-cache" }
          $hostedDir = Join-Path $pubCache "hosted/pub.dev"
          $content = Get-Content $genPlugins -Raw

          # Find all plugin symlink references and replace them with real paths from pub cache
          $pluginRefs = [regex]::Matches($content, '\.plugin_symlinks[/\\]([^/\\"]+)')
          foreach ($match in $pluginRefs) {
            $pluginName = $match.Groups[1].Value
            $pluginDir = Get-ChildItem $hostedDir -Directory | Where-Object { $_.Name -like "$pluginName-*" } | Sort-Object Name -Descending | Select-Object -First 1
            if ($pluginDir) {
              $realPath = $pluginDir.FullName.Replace('\', '/')
              $content = $content -replace [regex]::Escape(".plugin_symlinks/$pluginName"), $realPath
              $content = $content -replace [regex]::Escape(".plugin_symlinks\$pluginName"), $realPath
              Write-Host "   -> Mapped $pluginName to $realPath"
            }
          }
          $content | Set-Content $genPlugins -NoNewline

          # 5. Manual Compilation (Bypassing 'flutter build' to keep our patches)
          Write-Host "==> Compiling Release Build..."
          cmake --build $buildDir --config Release --target INSTALL

          # 6. Locate the resulting EXE
          $exe = Get-ChildItem -Recurse "build\windows" -Filter "bluetooth_chat.exe" |
                 Where-Object { $_.DirectoryName -match "Release" } | Select-Object -First 1
          
          if (!$exe) { throw "Build failed: EXE not found" }
          "RELEASE_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "✅ Build Success: $($exe.FullName)"

      - name: 📥 Install NSIS
        run: choco install nsis --yes

      - name: 🔨 Create NSIS installer
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          $releaseDir = $env:RELEASE_DIR
          $script = @'
          Unicode true
          !define APP_NAME    "BT SecureChat"
          !define APP_VERSION "APPVER"
          !define APP_EXE      "bluetooth_chat.exe"
          !define BUILD_DIR    "BUILDDIR"
          !define PUBLISHER    "Ozo.Designer"

          Name           "${APP_NAME} ${APP_VERSION}"
          OutFile        "BT-SecureChat-Setup-v${APP_VERSION}.exe"
          InstallDir     "$PROGRAMFILES64\BT SecureChat"
          RequestExecutionLevel admin
          SetCompressor lzma

          Page directory
          Page instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "${BUILD_DIR}\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortcut "$DESKTOP\BT SecureChat.lnk" "$INSTDIR\${APP_EXE}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "DisplayName" "${APP_NAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\BT SecureChat" "Publisher" "${PUBLISHER}"
          SectionEnd

          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$DESKTOP\BT SecureChat.lnk"
          SectionEnd
          '@
          $script = $script -replace 'APPVER', $version -replace 'BUILDDIR', $releaseDir
          $script | Out-File "installer.nsi" -Encoding UTF8
          makensis installer.nsi

      - name: 🚀 Upload Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: BT-SecureChat-*
          file_glob: true
          tag: v1.1.${{ github.run_number }}
          overwrite: true
