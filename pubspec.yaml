name: bluetooth_chat
description: AES-256 Encrypted Bluetooth Chat for Android, iOS, and Desktop.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8

  # ── UI & Fonts (Fixes your error) ─────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── Bluetooth ─────────────────────────────────────────────────────────
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^1.34.0

  # ── Permissions ───────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Encryption ────────────────────────────────────────────────────────
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # ── State Management ──────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Persistence ───────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Utilities ─────────────────────────────────────────────────────────
  uuid: ^4.3.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  # Ensure you have an assets folder if you uncomment this:
  # assets:
  #   - assets/