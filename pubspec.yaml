name: bluetooth_chat
description: AES-256 Encrypted Bluetooth Chat for Android, iOS, and Desktop.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── UI & Fonts ────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── Bluetooth ─────────────────────────────────────────────────────────
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^1.34.0

  # ── Permissions & Device Info ─────────────────────────────────────────
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # ── Encryption ────────────────────────────────────────────────────────
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # ── State Management ──────────────────────────────────────────────────
  provider: ^6.1.2
  file_picker: ^8.0.0

  # ── Persistence ───────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Utilities ─────────────────────────────────────────────────────────
  uuid: ^4.3.3
  rxdart: ^0.28.0
  network_info_plus: ^7.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # FIX: Downgraded flutter_lints 4.x → 3.x.
  # flutter_lints 4.x pulls lints 4.0.0 which adds `no_wildcard_variable_uses`
  # (requires Dart >=3.3). Our SDK constraint is >=3.0.0, so the analyzer
  # warns that the rule is unrecognised. flutter_lints 3.x pulls lints 3.x
  # which is fully compatible with Dart >=3.0.0 and does not include that rule.
  # Bump back to ^4.0.0 when the SDK floor is raised to >=3.3.
  flutter_lints: ^3.0.0

  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  bdd_widget_test: ^1.2.1
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  # assets:
  #   - assets/