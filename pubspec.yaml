name: bluetooth_chat
description: AES-256 Encrypted Bluetooth Chat for Android, iOS, and Desktop.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── UI & Fonts ────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── Bluetooth ─────────────────────────────────────────────────────────
  # flutter_bluetooth_serial: Android/iOS classic BT only
  # flutter_blue_plus: BLE support
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^1.34.0

  # ── Permissions & Device Info ─────────────────────────────────────────
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0  # <── ADDED THIS to fix PermissionHelper errors

  # ── Encryption ────────────────────────────────────────────────────────
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # ── State Management ──────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Persistence ───────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Utilities ─────────────────────────────────────────────────────────
  uuid: ^4.3.3
  rxdart: ^0.28.0
  network_info_plus: ^7.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  bdd_widget_test: ^1.2.1
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true

  # Custom platform handling for Windows compatibility
  plugin:
    platforms:
      windows:
        default_package: null

  # assets:
  #   - assets/